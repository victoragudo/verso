name: Bug report
description: Something in Verso does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Security problems go to the Security tab, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Admin > Posts
        2. Click "Add post"
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Verso version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PHP version, database and browser.
      placeholder: PHP 8.4, MySQL 8, Firefox 140
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Lines from storage/logs/laravel.log or the browser console. Remove any private data first.
      render: text
