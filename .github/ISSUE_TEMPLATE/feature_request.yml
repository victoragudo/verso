name: Feature request
description: An idea to make Verso better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How would you like it to work?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor and builder
        - Site Editor and themes
        - Plugins
        - SEO
        - Admin and settings
        - Install and updates
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Other ways you tried
