# Weekly dependency updates. Minor and patch updates come as one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 has no stable compiler API yet, and scripts/i18n/hardcoded-strings.mjs needs it.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
