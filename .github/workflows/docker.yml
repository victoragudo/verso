# Builds the Docker image (docker/Dockerfile) for linux/amd64 and linux/arm64.
# A version tag (v*) pushes it to ghcr.io/victoragudo/verso as <version>, <major>.<minor> and latest.
# Pull requests that change the image, and manual runs, only build it (a dry run, nothing is pushed).
name: docker

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/victoragudo/verso

jobs:
  image:
    name: Build the image
    # Only the main Verso repository builds and publishes the image.
    if: github.repository == 'victoragudo/verso'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tag must match the VERSION file, like the release package.
      - name: Check the tag
        if: github.event_name == 'push'
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION ${version}." >&2
            exit 1
          fi

      - name: Setup QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A pre-release tag (v0.2.0-beta.1) only gets its own tag, never latest.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=Verso
            org.opencontainers.image.description=Verso, an open source CMS on Laravel, ready to try locally.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://verso-cms.pages.dev
            org.opencontainers.image.documentation=https://github.com/victoragudo/verso/blob/main/docs/DOCKER.md

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSO_VERSION=${{ steps.meta.outputs.version }}
            VERSO_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
