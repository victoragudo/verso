# Lint and static analysis run once. Tests run on PHP 8.4 and 8.5 against SQLite, MySQL and Postgres.
# Then two browser jobs: the Easy mode journey and the documented install.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and static analysis
    # Only the main Verso repository runs this workflow.
    if: github.repository == 'victoragudo/verso'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP, Node and dependencies
        uses: ./.github/actions/setup
        with:
          php-version: '8.4'

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # The TypeScript code imports the generated route helpers.
      - name: Generate Wayfinder routes
        run: php artisan wayfinder:generate --with-form

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check PHP code style
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Check TypeScript types
        run: npm run types:check

      - name: Lint and check formatting
        run: npx vp check --deny-warnings

      - name: Check that lang/en.json matches the code
        run: php artisan verso:lang-extract --check

  audit:
    name: Dependency audit
    # Only the main Verso repository runs this workflow.
    if: github.repository == 'victoragudo/verso'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Both audits read the lock files, so nothing has to be installed.
      - name: Audit Composer packages
        run: composer audit --locked --no-interaction

      - name: Audit npm packages used in production
        run: npm audit --audit-level=high --omit=dev

  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    # Only the main Verso repository runs this workflow.
    if: github.repository == 'victoragudo/verso'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        database: [sqlite, mysql, pgsql]
        include:
          - database: sqlite
            db_host: ''
            db_port: ''
            db_database: ':memory:'
            db_username: ''
          - database: mysql
            db_host: 127.0.0.1
            db_port: '3306'
            db_database: verso
            db_username: root
          - database: pgsql
            db_host: 127.0.0.1
            db_port: '5432'
            db_database: verso
            db_username: verso

    # Both databases start in every job. The DB_CONNECTION variable picks the one the tests use.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: verso
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -psecret --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: verso
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: verso
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U verso"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_DATABASE: ${{ matrix.db_database }}
      DB_USERNAME: ${{ matrix.db_username }}
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP, Node and dependencies
        uses: ./.github/actions/setup
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, gd, intl

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # Pages are rendered with the Vite manifest, and the build also writes the Wayfinder routes.
      - name: Build assets
        run: npm run build

      - name: Run tests
        run: php artisan test --parallel

      # The JavaScript tests do not depend on PHP or the database, so they run in one cell only.
      - name: Run JavaScript tests
        if: matrix.php == '8.4' && matrix.database == 'sqlite'
        run: npm test

  e2e:
    name: Browser journey (Playwright)
    # Only the main Verso repository runs this workflow.
    if: github.repository == 'victoragudo/verso'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # New job: it does not block a merge until it has run green for a while.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP, Node and dependencies
        uses: ./.github/actions/setup
        with:
          php-version: '8.5'

      # The journey runs the real install wizard, so it only needs a .env to boot. It never writes to it.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build assets
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the Easy mode journey at 1440 and 390 px
        run: npm run test:e2e

      # The report, traces, screenshots and the Laravel log of every throwaway site.
      - name: Upload the test report and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            storage/logs/
          if-no-files-found: ignore
          retention-days: 14

  fresh-install:
    name: Documented install (create-project, artisan serve, wizard)
    # Only the main Verso repository runs this workflow.
    if: github.repository == 'victoragudo/verso'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only Playwright is needed here. The new project installs its own packages, with the Composer cache.
      - name: Setup PHP, Node and dependencies
        uses: ./.github/actions/setup
        with:
          php-version: '8.5'
          composer-install: 'false'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # composer create-project from this checkout (a path repository), php artisan serve,
      # then the whole web wizard with SQLite and an admin login.
      - name: Install Verso like a new user
        run: npm run test:e2e:install

      # The report, traces, screenshots and the Laravel log of the new site.
      - name: Upload the test report and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-install-report
          path: |
            playwright-report/
            test-results/
            storage/logs/
          if-no-files-found: ignore
          retention-days: 14
