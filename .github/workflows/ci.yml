# Runs every check on PHP 8.4 and 8.5 against SQLite, MySQL and Postgres.
name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.database }}
    # Only the main Verso repository runs this workflow.
    if: github.repository == 'victoragudo/verso'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        database: [sqlite, mysql, pgsql]
        include:
          - database: sqlite
            db_host: ''
            db_port: ''
            db_database: ':memory:'
            db_username: ''
          - database: mysql
            db_host: 127.0.0.1
            db_port: '3306'
            db_database: verso
            db_username: root
          - database: pgsql
            db_host: 127.0.0.1
            db_port: '5432'
            db_database: verso
            db_username: verso

    # Both databases start in every job. The DB_CONNECTION variable picks the one the tests use.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: verso
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -psecret --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: verso
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: verso
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U verso"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: ${{ matrix.db_host }}
      DB_PORT: ${{ matrix.db_port }}
      DB_DATABASE: ${{ matrix.db_database }}
      DB_USERNAME: ${{ matrix.db_username }}
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql, gd, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build assets
        run: npm run build

      # Style, static analysis and types do not depend on the database, so they run once per PHP version.
      - name: Check code style
        if: matrix.database == 'sqlite'
        run: vendor/bin/pint --test

      - name: Static analysis
        if: matrix.database == 'sqlite'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Check TypeScript types
        if: matrix.database == 'sqlite'
        run: npm run types:check

      - name: Run tests
        run: php artisan test --parallel

      - name: Run JavaScript tests
        if: matrix.database == 'sqlite'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "package.json has no test script."
          fi

  e2e:
    name: Browser journey (Playwright)
    # Only the main Verso repository runs this workflow.
    if: github.repository == 'victoragudo/verso'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # New job: it does not block a merge until it has run green for a while.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, gd, intl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install npm dependencies
        run: npm ci

      # The journey runs the real install wizard, so it only needs a .env to boot. It never writes to it.
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build assets
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the Easy mode journey at 1440 and 390 px
        run: npm run test:e2e
