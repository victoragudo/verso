# Sets up PHP, Node and the dependencies the same way in every CI job, with Composer and npm caches.
name: Setup Verso
description: PHP, Node, Composer and npm packages, with caches.

inputs:
  php-version:
    description: PHP version.
    required: true
  extensions:
    description: PHP extensions.
    required: false
    default: pdo_sqlite, gd, intl
  composer-install:
    description: Run composer install. The Composer cache is set up either way.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        tools: composer:v2
        coverage: none

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22'
        cache: npm

    - name: Find the Composer cache folder
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-php${{ inputs.php-version }}-

    - name: Install Composer dependencies
      if: inputs.composer-install == 'true'
      shell: bash
      run: composer install --no-interaction --no-progress --prefer-dist

    - name: Install npm dependencies
      shell: bash
      run: npm ci
